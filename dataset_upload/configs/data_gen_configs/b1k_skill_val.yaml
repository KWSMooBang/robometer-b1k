# BEHAVIOR-1K -> RBM trajectories (VAL split)
#
# Same repo and output_dir as b1k_skill.yaml, different HF config name, so both
# land in one dataset repo as two configs. Episodes are split per task, never
# within an episode, so train and val share no episode.
#
# The val split stays positives-only: evaluation should measure progress on real
# demonstrations, not on clips we synthesised.

dataset:
  dataset_path: /path/to/behavior-1k/2026-challenge-demos
  dataset_name: b1k_skill_val

  b1k:
    video_key: observation.rgb.zed_link_camera_0
    annotation_level: skill

    task_whitelist: ["turning_on_radio"]
    max_episodes_per_task: null
    max_segments_per_task: null

    min_segment_frames: 15
    max_segment_frames: 3000
    val_demo_ratio: 0.1

    truncated_negative_ratio: 0.0

    data_source: b1k_skill
    include_task_context: false
    seed: 42

output:
  output_dir: datasets/b1k_rbm
  max_trajectories: -1
  max_frames: 64
  use_video: true
  fps: 30
  shortest_edge_size: 240
  center_crop: false
  num_workers: 8

hub:
  push_to_hub: false
  hub_repo_id: b1k_rbm
